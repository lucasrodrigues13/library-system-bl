services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-libraryroot}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-library}
      MYSQL_USER: ${MYSQL_USER:-library}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-library}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-libraryroot}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${APP_ENV:-Development}
      ASPNETCORE_URLS: http://+:8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      ConnectionStrings__Default: Server=mysql;Port=3306;Database=${MYSQL_DATABASE:-library};User=${MYSQL_USER:-library};Password=${MYSQL_PASSWORD:-library};
      Jwt__Secret: ${Jwt__Secret:-change-me-to-a-long-development-secret-of-at-least-32-chars}
      Jwt__Issuer: ${Jwt__Issuer:-LibrarySystem}
      Jwt__Audience: ${Jwt__Audience:-LibrarySystem}
      Jwt__ExpiryMinutes: ${Jwt__ExpiryMinutes:-480}
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        API_BASE_URL: ${API_BASE_URL:-http://localhost:8080}
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    depends_on:
      - backend

volumes:
  mysql_data:
